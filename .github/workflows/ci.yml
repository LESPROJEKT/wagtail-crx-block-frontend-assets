name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            toxenv: py39-wagtail42-crx2
          - python-version: "3.9"
            toxenv: py39-wagtail42-crx2-float
          - python-version: "3.10"
            toxenv: py310-wagtail52-crx3
          - python-version: "3.10"
            toxenv: py310-wagtail52-crx3-float
          - python-version: "3.11"
            toxenv: py311-wagtail63-crx4
          - python-version: "3.11"
            toxenv: py311-wagtail63-crx4-float
          - python-version: "3.11"
            toxenv: py311-wagtail63-crx5
          - python-version: "3.11"
            toxenv: py311-wagtail63-crx5-float
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run tests
        run: tox -e ${{ matrix.toxenv }}
